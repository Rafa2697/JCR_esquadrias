<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Fotos - JCR Esquadrias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="galeria.css">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
</head>
<body class="bg-[#0a0a0a] text-slate-50 antialiased selection:bg-emerald-500 selection:text-white">
    
    <!-- Navbar -->
    <header class="fixed top-0 w-full z-50 glass transition-all duration-300 border-b border-white/5">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3 text-slate-300 hover:text-emerald-400 transition-colors group">
                <i class="bi bi-arrow-left text-xl group-hover:-translate-x-1 transition-transform"></i>
                <span class="font-medium hidden sm:inline">Voltar para o site</span>
                <span class="font-medium sm:hidden">Voltar</span>
            </a>
            
            <div class="flex items-center gap-2">
                <span class="font-heading font-bold text-xl tracking-wider text-emerald-400">JCR</span>
            </div>
        </div>
    </header>

    <main class="pt-28 pb-20 max-w-7xl mx-auto">
        <div class="text-center mb-12 px-6">
            <h1 class="font-heading text-4xl md:text-5xl font-bold text-slate-50 mb-4">Nosso <span class="text-emerald-400">Portfólio</span></h1>
            <div class="w-20 h-1 bg-emerald-500 rounded-full mx-auto mb-6"></div>
            <p class="text-slate-400 max-w-2xl mx-auto text-lg">Confira alguns dos nossos projetos entregues com excelência e qualidade.</p>
        </div>

        <section class="gallery-grid">
            <img src="img/armario_de_cozinha.jpg" alt="Armário de cozinha" loading="lazy">
            <img src="img/espelho.jpg" alt="Espelhos" loading="lazy">
            <img src="img/fotoPortao.jpg" alt="Portão de Alumínio" loading="lazy">
            <img src="img/guarda_roupa.jpg" alt="Guarda roupa de alumínio" loading="lazy">
            <img src="img/janela_vidro.jpg" alt="Janela de vidro temperado" loading="lazy">
            <img src="img/porta_veneziana.jpg" alt="Porta veneziana" loading="lazy">
            <img src="img/teto_corredor.jpg" alt="Teto de vidro" loading="lazy">
            <img src="img/telhado.jpg" alt="Cobertura" loading="lazy">
            <img src="img/vitro_banheiro.jpg" alt="Vitro de banheiro" loading="lazy">
            <img src="img/movelplanejado.png" alt="Móveis planejado" loading="lazy">
            <img src="img/vidro.jpg" alt="Box banheiro" loading="lazy">
            <img src="img/moveis.jpg" alt="Guarda roupa" loading="lazy">
            <img src="img/porta_aluminio.jpg" alt="Porta entrada" loading="lazy">
            <img src="img/porta branca.jpeg" alt="Porta branca" loading="lazy">
            <img src="img/porta de vidro temperada.jpeg" alt="Porta de vidro" loading="lazy">
            <img src="img/portão branco.jpeg" alt="Portão branco" loading="lazy">
            <img src="img/portão bronze.jpeg" alt="Portão bronze" loading="lazy">
            <img src="img/portinhola amadeirada.jpeg" alt="Portinhola" loading="lazy">
            <img src="img/portinhola bronze (2).jpeg" alt="Portinhola" loading="lazy">
            <img src="img/portinhola bronze.jpeg" alt="Portinhola" loading="lazy">
            <img src="img/vitro basculante.jpeg" alt="Vitro" loading="lazy">
            <img src="img/corrimão.jpeg" alt="Corrimão" loading="lazy">
            <img src="img/fachada aluminio.jpeg" alt="Casa de alumínio" loading="lazy">
            <img src="img/grades aluminio.jpeg" alt="Grades alumínio" loading="lazy">
            <img src="img/janela de vidro temperado.jpeg" alt="Janela de vidro temperado" loading="lazy">
            <img src="img/porta com tela.jpeg" alt="Porta com tela" loading="lazy">
            <img src="img/porta grade.jpeg" alt="Porta grade" loading="lazy">
            <img src="img/porta tela bronze.jpeg" alt="Porta tela bronze" loading="lazy">
            <img src="img/portão vazado.jpeg" alt="Portão vazado" loading="lazy">
            <img src="img/portinhola de vidro.jpeg" alt="Portinhola vidro" loading="lazy">
        </section>
    </main>

    <footer class="border-t border-white/10 pt-8 pb-8 bg-[#080808]">
        <div class="max-w-6xl mx-auto px-6 text-center text-sm text-slate-500">
            <p>&copy; 2024 JCR Esquadrias. Todos os direitos reservados.</p>
        </div>
    </footer>
</body>
</html>
